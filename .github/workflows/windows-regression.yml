name: Windows regression

on:
  push:
    paths:
      - '.github/workflows/windows-regression.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/windows-regression.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: powershell
        run: |
          choco install autohotkey --yes --no-progress

          function Test-AhkV2Candidate([string]$Path) {
            if ([string]::IsNullOrWhiteSpace($Path) -or -not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return $false
            }

            $normalizedPath = $Path -replace '/', '\'
            $fileVersion = (Get-Item -LiteralPath $Path).VersionInfo.FileVersion
            if (-not [string]::IsNullOrWhiteSpace($fileVersion)) {
              if ($fileVersion -match '^2\.') {
                return $true
              }

              Write-Host "Rejecting AutoHotkey candidate (FileVersion=$fileVersion): $Path"
              return $false
            }

            if ($normalizedPath -match '(?i)\\AutoHotkey\\v2\\AutoHotkey(?:64)?\.exe$') {
              return $true
            }

            Write-Host "Rejecting AutoHotkey candidate with unknown version metadata: $Path"
            return $false
          }

          $registryCandidates = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey64.exe',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey.exe',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey64.exe',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey.exe',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey64.exe',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\AutoHotkey.exe'
          ) | ForEach-Object {
            (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).'(default)'
          }

          $orderedCandidates = @()
          $orderedCandidates += @(
            (Join-Path $env:ProgramFiles 'AutoHotkey\v2\AutoHotkey64.exe'),
            (Join-Path $env:ProgramFiles 'AutoHotkey\v2\AutoHotkey.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\v2\AutoHotkey64.exe' }),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\v2\AutoHotkey.exe' }),
            $(if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA 'Programs\AutoHotkey\v2\AutoHotkey64.exe' }),
            $(if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA 'Programs\AutoHotkey\v2\AutoHotkey.exe' })
          )
          $orderedCandidates += @($registryCandidates)
          $orderedCandidates += @(
            (Get-Command AutoHotkey64.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            (Get-Command AutoHotkey.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            (Join-Path $env:ProgramFiles 'AutoHotkey\AutoHotkey64.exe'),
            (Join-Path $env:ProgramFiles 'AutoHotkey\AutoHotkey.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\AutoHotkey64.exe' }),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\AutoHotkey.exe' })
          )

          $ahkCandidates = $orderedCandidates |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -Unique

          $ahkPath = $null
          foreach ($candidate in $ahkCandidates) {
            Write-Host "Probing AutoHotkey candidate: $candidate"
            if (Test-AhkV2Candidate -Path $candidate) {
              $ahkPath = $candidate
              break
            }
          }

          if (-not $ahkPath) {
            $ahkRoots = @(
              (Join-Path $env:ProgramFiles 'AutoHotkey'),
              $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey' })
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_ -PathType Container) }

            foreach ($root in $ahkRoots) {
              Write-Host "Contents under ${root}:"
              Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName |
                ForEach-Object { Write-Host "  $_" }
            }

            throw 'AutoHotkey v2 executable not found after Chocolatey install.'
          }

          $probeOutput = & $ahkPath '/ErrorStdOut' '/CP65001' 2>&1 | Out-String
          if ($probeOutput -match '(?im)This script requires AutoHotkey v2\.0\.' -or
              $probeOutput -match '(?im)Current interpreter:\s*AutoHotkey v1(?:\.|\b)' -or
              $probeOutput -match '(?im)\bAutoHotkey v1(?:\.|\b)') {
            Write-Host $probeOutput.Trim()
            throw "Resolved AutoHotkey executable probe reported the wrong runtime: $ahkPath"
          }

          $probeVersionMatch = [regex]::Match($probeOutput, '(?im)^\s*(?:AutoHotkey\s+)?v(?<major>\d+)\.')
          if ($probeVersionMatch.Success -and $probeVersionMatch.Groups['major'].Value -ne '2') {
            Write-Host $probeOutput.Trim()
            throw "Resolved AutoHotkey executable probe did not report v2: $ahkPath"
          }

          Split-Path -Parent $ahkPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "REGRESSION_AHK_EXE=$ahkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved AutoHotkey v2 at $ahkPath"

      - name: Prepare regression artifact directory
        shell: powershell
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-regression-artifacts'
          if (Test-Path -LiteralPath $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

      - name: Run regression suite
        id: regression
        shell: powershell
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-regression-artifacts'
          $logPath = Join-Path $artifactDir 'regression.log'
          $regressionArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts\Regression.ps1')
          if (-not [string]::IsNullOrWhiteSpace($env:REGRESSION_AHK_EXE)) {
            $regressionArgs += @('-AhkExe', $env:REGRESSION_AHK_EXE)
          }

          & powershell @regressionArgs *>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $forbiddenPatterns = @(
            '(?im)This script requires AutoHotkey v2\.0\.',
            '(?im)Current interpreter:\s*AutoHotkey v1(?:\.|\b)',
            '(?im)\bAutoHotkey v1(?:\.|\b)'
          )
          $requiredPatterns = @(
            '(?im)^Resolved AutoHotkey v2 executable:\s+.+$'
          )
          $logText = Get-Content -LiteralPath $logPath -Raw
          foreach ($pattern in $requiredPatterns) {
            if ($logText -notmatch $pattern) {
              Write-Error "Regression log did not emit required AutoHotkey runtime evidence matching pattern: $pattern"
              exit 1
            }
          }

          foreach ($pattern in $forbiddenPatterns) {
            if ($logText -match $pattern) {
              Write-Error "Regression log emitted forbidden AutoHotkey runtime text matching pattern: $pattern"
              exit 1
            }
          }

      - name: Write regression artifact summary
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-regression-artifacts'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $summaryPath = Join-Path $artifactDir 'regression-summary.md'
          $contextPath = Join-Path $artifactDir 'workflow-context.txt'
          $logPath = Join-Path $artifactDir 'regression.log'
          $preRegressionMarkerPath = Join-Path $artifactDir 'pre-regression-failure.txt'
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $hasRegressionLog = Test-Path -LiteralPath $logPath -PathType Leaf
          $proofLines = @()
          $limitLines = @(
            '- It is not direct observation on a native Windows desktop.',
            '- It does not replace PASS-grade evidence in `docs\headless_default_release_gate.md`.',
            '- It does not prove local scheduled-task behavior for `OneClickBackupDaily`.'
          )

          if ($hasRegressionLog -and $env:REGRESSION_OUTCOME -eq 'success') {
            $proofLines = @(
              '- `scripts\Regression.ps1` ran on `windows-latest`.',
              '- The static headless-default guard passed.',
              '- Fixture-backed prereq checks passed, including expected failure fixtures.',
              '- The safe smoke path was exercised with the repo-local readiness fixture by default.'
            )
          }
          elseif ($hasRegressionLog) {
            $proofLines = @(
              '- `scripts\Regression.ps1` started and produced `regression.log` on `windows-latest`.',
              '- This artifact captures partial regression evidence only; inspect `regression.log` for the last completed check.'
            )
            $limitLines = @(
              '- It does **not** prove the full regression suite passed.',
              '- It does **not** prove all prereq checks or the safe smoke path completed successfully.'
            ) + $limitLines
          }
          else {
            $proofLines = @(
              '- This run failed before the regression suite produced `regression.log`.',
              '- Treat this as a pre-regression failure artifact only; `scripts\Regression.ps1` did not run to a log-producing point.'
            )
            $limitLines = @(
              '- It does **not** prove `scripts\Regression.ps1` ran on `windows-latest`.',
              '- It does **not** prove the static headless-default guard passed.',
              '- It does **not** prove fixture-backed prereq checks passed.',
              '- It does **not** prove the safe smoke path was exercised.'
            ) + $limitLines

            @(
              'windows-regression pre-regression failure marker',
              'This run failed before the regression suite produced regression.log.',
              'The regression step did not run to a log-producing point.',
              "job_status=$env:JOB_STATUS",
              "regression_outcome=$env:REGRESSION_OUTCOME",
              'regression_log_present=false',
              "run_url=$runUrl"
            ) | Set-Content -Path $preRegressionMarkerPath -Encoding UTF8
          }

          @(
            '# Windows regression artifact summary',
            '',
            "- Outcome: $env:REGRESSION_OUTCOME",
            "- Job status: $env:JOB_STATUS",
            "- Regression log present: $hasRegressionLog",
            "- Repository: $env:GITHUB_REPOSITORY",
            "- Ref: $env:GITHUB_REF",
            "- Commit: $env:GITHUB_SHA",
            "- Event: $env:GITHUB_EVENT_NAME",
            "- Workflow: $env:GITHUB_WORKFLOW",
            "- Run: $env:GITHUB_RUN_NUMBER (attempt $env:GITHUB_RUN_ATTEMPT)",
            "- Run URL: $runUrl",
            '',
            '## What this artifact proves'
          ) + $proofLines + @(
            '',
            '## What this artifact does not prove'
          ) + $limitLines | Set-Content -Path $summaryPath -Encoding UTF8

          @(
            "artifact_dir=$artifactDir",
            "job_status=$env:JOB_STATUS",
            "outcome=$env:REGRESSION_OUTCOME",
            "regression_log_present=$hasRegressionLog",
            "run_url=$runUrl"
          ) | Set-Content -Path $contextPath -Encoding UTF8

      - name: Upload regression artifact bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-regression-artifacts
          if-no-files-found: error
          retention-days: 30
