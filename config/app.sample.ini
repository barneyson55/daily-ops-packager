[paths]
watchDir=C:\Work\Daily
outDir=out
tmpDir=%TEMP%\oneclick_backup_tmp

[patterns]
extensions=*.pdf;*.xlsx;*.docx;*.fbk;*.bak
include=
exclude=

[zip]
exe=C:\Program Files\7-Zip\7z.exe
passwordEnv=DAILY_ZIP_PASS
archiveName=oneclick_{YYYYMMDD}_{HHmm}.7z
verify=0

[rclone]
exe=C:\Tools\rclone\rclone.exe
remote=myremote:backups/daily
retries=3

[email]
enabled=0
smtpHost=smtp.example.com
smtpPort=587
useSsl=1
from=noreply@example.com
to=owner@example.com
user=noreply@example.com
passwordEnv=DAILY_SMTP_PASS
