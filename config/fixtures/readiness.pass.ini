[paths]
watchDir=config\fixtures\watch
outDir=config\fixtures\out
tmpDir=config\fixtures\tmp

[patterns]
extensions=*.txt
include=
exclude=

[zip]
exe=config\fixtures\bin\7z.exe
passwordEnv=READINESS_ZIP_PASS
archiveName=readiness_{YYYYMMDD}.7z
verify=0

[rclone]
exe=config\fixtures\bin\rclone.exe
remote=fixture-remote:daily
retries=3

[email]
enabled=0
smtpHost=smtp.example.com
smtpPort=587
useSsl=1
from=noreply@example.com
to=owner@example.com
user=noreply@example.com
passwordEnv=READINESS_SMTP_PASS
